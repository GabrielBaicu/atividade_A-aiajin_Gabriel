<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario AÇAIAJIN</title>
    <link rel="stylesheet" href="_css/estilo.css">
</head>
<body>
    <h1>Formulario SUPER<strong>AÇAI</strong>AJIN</h1>
    <form method="get" action="confirma.html">
        <fieldset>
            <legend>
                Dados Pessoais:
            </legend>
            <label>Nome:<p></p><input type="text" required></label>
            <p></p>
            <label>idade:<p></p><input type="number" required></label>
            <p></p>
            <label>Telefone:<p></p><input type="tel" required></label>
            <p></p>
            <label>Endereço:<p></p><input type="text" required></label>
            <p></p>
            <label>Planeta de Origem</label>
            <br>
            <br>
            <select>
                <option>Planeta Terra</option>
                <option>Planeta Namek</option>
                <option>Planeta Vegeta</option>
                <option>Outros</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Dados extras:</legend>
            <label>Raça do Universo 7 preferida:
                <select>
                    <option>Terráqueo</option>
                    <option>Sayajin</option>
                    <option>namekuseijin</option>
                    <option>Androide</option>
                    <option>outros</option>
                </select>
            </label>
            <br>
            <br>
            <label>Trabalho:
                <input type="radio" name="cargo" value="1" checked>Autônomo
                <input type="radio" name="cargo" value="1">Empregado CLT
                <input type="radio" name="cargo" value="1">Empresário
                <input type="radio" name="cargo" value="1">Tipo Goku
            </label>
        </fieldset>
        <fieldset>
            <legend>Seu açai perfeito de que jeito?</legend>
            <input type="checkbox">Puro
            <input type="checkbox">Com Banana
            <input type="checkbox">Com Morango
            <input type="checkbox">Com Granola
            <input type="checkbox">Tem gosto de terra
        </fieldset>
        <fieldset>
            <legend>Qual o seu tamanho preferido?</legend>
            <input type="radio" name="tamanho" value="1" checked>500ml
            <input type="radio" name="tamanho" value="2">300ml
            <input type="radio" name="tamanho" value="3">100nl
            <input type="radio" name="tamanho" value="4">Casquinha
            <input type="radio" name="tamanho" value="5">Qual parte do gosto de terra você não entendeu?
        </fieldset>
        <fieldset>
            Observaçoes:<br>
            <textarea cols="195" rows="10">Escreva suas observações aqui... Eu gosto de açai porque...</textarea>
        </fieldset>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
